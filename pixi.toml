[workspace]
name = "omniground"
version = "0.1.0"
description = "Unified VLM grounding service"
channels = ["conda-forge"]
platforms = ["linux-64"]

[dependencies]
anyio = ">=4,<4.11"
python = "3.11.*"
fastapi = "*"
httpx = "*"
socksio = "*"
pillow = "*"
pydantic = "*"
python-multipart = "*"
pyyaml = "*"
pytest = "*"
requests = "*"
starlette = ">=0.46,<0.50"
uvicorn = "*"
pip = ">=26.1.2,<27"
setuptools = "<82"

[pypi-dependencies]
omniground = { path = ".", editable = true }
openai = ">=1.0"
torch = { version = "==2.12.1", index = "https://download.pytorch.org/whl/cu132" }
torchvision = { version = "==0.27.1", index = "https://download.pytorch.org/whl/cu132" }
accelerate = ">=1.14.0, <2"
transformers = ">=5.2.0"

[tasks]
setup = { cmd = "python -m omniground.cli.setup", depends-on = ["install"] }
install = "pixi install"
download-checkpoints = "python -m omniground.cli.checkpoints"
server = "python -m omniground.cli.server"
demo = "python -m omniground.cli.demo"
test = "pytest"
