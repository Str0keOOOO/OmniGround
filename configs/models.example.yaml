# Copy this file to models.yaml and adjust paths/endpoints for your deployment.
# Never put an API key in this file; use the environment variable named below.
default_model: qwen3.7-plus

models:
  molmo2-er:
    backend: molmo2
    mode: local
    source_path: third_party/molmo2
    checkpoint: models/Molmo2-ER
    hf_repo: allenai/Molmo2-ER
    device: auto
    device_map: auto
    max_new_tokens: 512
    default_temperature: 0.0

  # The smallest supported local option. It is the recommended first choice
  # for a laptop with a modest GPU; use device: cpu only when GPU execution is
  # unavailable (it will be much slower).
  rynnbrain1.1-2b:
    backend: rynnbrain
    mode: local
    checkpoint: models/RynnBrain1.1-2B
    hf_repo: Alibaba-DAMO-Academy/RynnBrain1.1-2B
    model_id_hint: rynnbrain1.1-2b
    device: auto
    device_map: auto
    max_new_tokens: 512
    default_temperature: 0.0

  rynnbrain1.1-9b:
    backend: rynnbrain
    mode: local
    checkpoint: models/RynnBrain1.1-9B
    hf_repo: Alibaba-DAMO-Academy/RynnBrain1.1-9B
    model_id_hint: rynnbrain1.1-9b
    device: auto
    device_map: auto
    max_new_tokens: 512
    default_temperature: 0.0

  robobrain2.5-4b:
    backend: robobrain
    mode: local
    source_path: third_party/robobrain25
    third_party_commit: af98c932aac9ff715d70da177088d7bb95573ff7
    checkpoint: models/RoboBrain2.5-4B
    hf_repo: BAAI/RoboBrain2.5-4B
    model_id_hint: robobrain2.5-4b
    device: auto
    device_map: auto
    max_new_tokens: 512
    default_temperature: 0.0

  robobrain2.5-8b-nv:
    backend: robobrain
    mode: local
    source_path: third_party/robobrain25
    third_party_commit: af98c932aac9ff715d70da177088d7bb95573ff7
    checkpoint: models/RoboBrain2.5-8B-NV
    hf_repo: BAAI/RoboBrain2.5-8B-NV
    model_id_hint: robobrain2.5-8b-nv
    device: auto
    device_map: auto
    max_new_tokens: 512
    default_temperature: 0.0

  qwen3.5-9b:
    backend: qwen35
    mode: local
    checkpoint: models/Qwen3.5-9B
    hf_repo: Qwen/Qwen3.5-9B
    model_id_hint: qwen3.5-9b
    device: auto
    device_map: auto
    max_new_tokens: 2048
    default_temperature: 0.0

  qwen3.5-27b:
    backend: qwen35
    mode: local
    checkpoint: models/Qwen3.5-27B
    hf_repo: Qwen/Qwen3.5-27B
    model_id_hint: qwen3.5-27b
    device: auto
    device_map: auto
    max_new_tokens: 2048
    default_temperature: 0.0

  qwen3.6-27b:
    backend: qwen35
    mode: local
    checkpoint: models/Qwen3.6-27B
    hf_repo: Qwen/Qwen3.6-27B
    model_id_hint: qwen3.6-27b
    device: auto
    device_map: auto
    max_new_tokens: 2048
    default_temperature: 0.0

  qwen3.5-4b:
    backend: qwen35
    mode: local
    checkpoint: models/Qwen3.5-4B
    hf_repo: Qwen/Qwen3.5-4B
    model_id_hint: qwen3.5-4b
    device: auto
    device_map: auto
    max_new_tokens: 2048
    default_temperature: 0.0

  qwen3.5-2b:
    backend: qwen35
    mode: local
    checkpoint: models/Qwen3.5-2B
    hf_repo: Qwen/Qwen3.5-2B
    model_id_hint: qwen3.5-2b
    device: auto
    device_map: auto
    max_new_tokens: 2048
    default_temperature: 0.0

  qwen3.5-0.8b:
    backend: qwen35
    mode: local
    checkpoint: models/Qwen3.5-0.8B
    hf_repo: Qwen/Qwen3.5-0.8B
    model_id_hint: qwen3.5-0.8b
    device: auto
    device_map: auto
    max_new_tokens: 2048
    default_temperature: 0.0

  qwen3.7-plus:
    backend: openai
    mode: api
    base_url: https://your-vlm-api-endpoint.example/v1
    model_name: your-vlm-model
    api_key_env: OPENAI_API_KEY
    timeout_seconds: 120
    extra_body:
      enable_thinking: true
